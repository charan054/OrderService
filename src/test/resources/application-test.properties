# Overlays src/main/resources/application.properties when the "test" profile is active.
# Points the app at an in-memory H2 database so tests never touch the real MySQL "charan" schema.
spring.datasource.url=jdbc:h2:mem:ordertest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tests build the schema from the entities on H2; the MySQL migrations are checked by hand (see db/migration).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Fixed, obviously-fake value so tests never depend on INTERNAL_SERVICE_API_KEY being set on the machine.
internal.service.api-key=test-service-key

# Don't try to connect to a Kafka broker when the Spring context starts.
spring.kafka.listener.auto-startup=false

# Never run the background alert job in tests (it would race the mocks and hit a mail server).
alerts.enabled=false

# Same for the pending-payment sweep.
sweeper.enabled=false

# And the daily digest.
digest.enabled=false

# And the loyalty expiry warnings.
loyalty.warning.enabled=false
