<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>

    <style>
        :root {
          --primary: #6d28d9;
          --primary-dark: #4c1d95;
          --green: #16a34a;
          --red: #dc2626;
          --dark: #0f172a;
          --muted: #64748b;
          --border: #e2e8f0;
          --bg: #f8fafc;
          --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: Inter, Segoe UI, Arial, sans-serif;
        }

        body {
          min-height: 100vh;
          background: var(--bg);
          color: var(--dark);
        }

        header.topbar {
          background: linear-gradient(135deg, #111827, #312e81, #6d28d9);
          color: white;
          padding: 22px 24px;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        header.topbar h1 {
          font-size: 22px;
        }

        #accountInfo {
          font-size: 14px;
          color: #ede9fe;
          display: flex;
          align-items: center;
          gap: 12px;
        }

        #accountInfo button {
          width: auto;
          padding: 8px 14px;
          font-size: 13px;
        }

        main {
          width: min(1100px, calc(100% - 32px));
          margin: 28px auto 60px;
        }

        .hidden { display: none !important; }

        .center-card {
          max-width: 380px;
          margin: 60px auto;
          background: white;
          border-radius: 20px;
          padding: 28px;
          box-shadow: var(--shadow);
          border: 1px solid var(--border);
        }

        .center-card h2 { margin-bottom: 6px; }
        .center-card p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }

        input, select {
          width: 100%;
          border: 1px solid #cbd5e1;
          border-radius: 12px;
          padding: 12px 14px;
          font-size: 15px;
          margin-bottom: 12px;
          outline: none;
          background: #fbfdff;
        }

        input:focus, select:focus {
          border-color: var(--primary);
          box-shadow: 0 0 0 4px rgba(109, 40, 217, 0.13);
        }

        button {
          width: 100%;
          border: none;
          border-radius: 12px;
          padding: 12px 16px;
          cursor: pointer;
          color: white;
          font-weight: 700;
          font-size: 15px;
          background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        button.secondary {
          background: #e2e8f0;
          color: var(--dark);
        }

        button.red { background: linear-gradient(135deg, #ef4444, #b91c1c); }

        .error-text { color: var(--red); font-size: 13px; margin: -6px 0 12px; }

        .layout {
          display: grid;
          grid-template-columns: 2fr 1fr;
          gap: 24px;
          align-items: start;
        }

        .product-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
          gap: 16px;
        }

        .product-card {
          background: white;
          border: 1px solid var(--border);
          border-radius: 16px;
          overflow: hidden;
          box-shadow: var(--shadow);
        }

        .product-image {
          height: 120px;
          background: #f1f5f9;
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--muted);
          font-size: 13px;
        }

        .product-image img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

        .product-body { padding: 14px; }
        .product-body h3 { font-size: 15px; margin-bottom: 2px; }
        .product-body .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
        .product-body .price-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 10px;
        }
        .product-body .price { font-weight: 800; font-size: 16px; }

        .qty-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .qty-row input { margin-bottom: 0; text-align: center; }

        .product-card { position: relative; }

        .wishlist-btn {
          position: absolute;
          top: 8px;
          right: 8px;
          width: 32px;
          height: 32px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.9);
          color: var(--muted);
          font-size: 16px;
          line-height: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0;
        }

        .wishlist-btn.active { color: var(--red); }

        .search-row { display: flex; gap: 10px; margin-bottom: 14px; }
        .search-row input { margin-bottom: 0; flex: 2; }
        .search-row select { margin-bottom: 0; flex: 1; }

        .account-summary {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
          gap: 12px;
          margin-bottom: 16px;
        }
        .account-summary > div {
          background: white;
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 12px;
          text-align: center;
        }
        .account-summary .value { display: block; font-size: 20px; font-weight: 800; }
        .account-summary .label { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

        .order-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          background: white;
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 12px 14px;
          margin-bottom: 8px;
        }
        .order-row .meta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
        .order-row .price { font-weight: 800; }

        .grid-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .grid-tabs button {
          width: auto;
          background: none;
          color: var(--muted);
          border-bottom: 2px solid transparent;
          border-radius: 0;
          padding: 6px 4px;
        }
        .grid-tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 800; }

        .price-drop-badge {
          display: inline-block;
          background: #dcfce7;
          color: #15803d;
          font-size: 11px;
          font-weight: 700;
          padding: 2px 8px;
          border-radius: 999px;
          margin-bottom: 6px;
        }

        .rating-row {
          display: flex;
          align-items: center;
          gap: 4px;
          font-size: 12px;
          color: var(--muted);
          margin-bottom: 6px;
        }

        .rating-row .stars { color: #f59e0b; letter-spacing: 1px; }

        .details-link {
          background: none;
          border: none;
          width: auto;
          color: var(--primary);
          font-weight: 600;
          font-size: 12px;
          padding: 0;
          margin-bottom: 6px;
          text-decoration: underline;
          cursor: pointer;
        }

        .modal-overlay {
          position: fixed;
          inset: 0;
          background: rgba(15, 23, 42, 0.55);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          z-index: 50;
        }

        .modal-box {
          background: white;
          border-radius: 20px;
          padding: 24px;
          width: min(560px, 100%);
          max-height: 85vh;
          overflow-y: auto;
          box-shadow: var(--shadow);
        }

        .modal-box h2 { margin-bottom: 4px; }
        .modal-box h3 { font-size: 15px; margin: 18px 0 8px; }

        .modal-close {
          width: auto;
          background: #e2e8f0;
          color: var(--dark);
          padding: 6px 12px;
          font-size: 13px;
          float: right;
        }

        .fbt-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
        .fbt-chip {
          flex: 0 0 auto;
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 8px 12px;
          font-size: 13px;
          background: #fbfdff;
        }
        .fbt-chip .fbt-count { color: var(--muted); font-size: 11px; }

        .review-item {
          border-bottom: 1px solid var(--border);
          padding: 10px 0;
        }
        .review-item:last-child { border-bottom: none; }
        .review-item .stars { color: #f59e0b; letter-spacing: 1px; font-size: 13px; }
        .review-item .review-meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
        .review-item .review-comment { font-size: 14px; }

        .review-form select, .review-form input { margin-bottom: 10px; }

        .panel {
          background: white;
          border: 1px solid var(--border);
          border-radius: 16px;
          box-shadow: var(--shadow);
          padding: 18px;
          position: sticky;
          top: 20px;
        }

        .panel h2 { font-size: 18px; margin-bottom: 12px; }

        .cart-line {
          display: flex;
          justify-content: space-between;
          font-size: 14px;
          padding: 8px 0;
          border-bottom: 1px solid #edf2f7;
        }

        .cart-line button {
          width: auto;
          background: none;
          color: var(--red);
          font-weight: 700;
          padding: 0 4px;
        }

        .qty-stepper {
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .qty-stepper button {
          width: auto;
          background: none;
          color: var(--dark);
          font-weight: 700;
          padding: 0 6px;
        }

        .total-row {
          display: flex;
          justify-content: space-between;
          font-weight: 800;
          font-size: 16px;
          margin: 14px 0;
        }

        .pay-option {
          display: flex;
          align-items: center;
          gap: 10px;
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 10px 12px;
          margin-bottom: 8px;
          cursor: pointer;
        }

        .pay-option.selected {
          border-color: var(--primary);
          background: #f5f3ff;
        }

        .pay-option input { width: auto; margin: 0; }

        .status-banner {
          margin-top: 12px;
          font-size: 13px;
          font-weight: 700;
          padding: 10px 12px;
          border-radius: 10px;
        }

        .status-banner.success { background: #dcfce7; color: #15803d; }
        .status-banner.error { background: #fee2e2; color: #b91c1c; }
        .status-banner.info { background: #ede9fe; color: var(--primary-dark); }

        @media (max-width: 800px) {
          .layout { grid-template-columns: 1fr; }
          .panel { position: static; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <h1>Shop</h1>
    <div id="accountInfo"></div>
</header>

<main>
    <section id="loginSection" class="center-card">
        <h2>Welcome</h2>
        <p>Enter your phone number to continue.</p>
        <input type="tel" id="loginPhno" placeholder="10-digit phone number" />
        <div id="loginError" class="error-text hidden"></div>
        <button onclick="login()">Continue</button>
        <button class="secondary" style="margin-top:10px;" onclick="toggleTrackOrder()">Track an order instead</button>
    </section>

    <section id="trackOrderSection" class="center-card hidden">
        <h2>Track an order</h2>
        <p>No login needed - enter the phone number the order was placed with and its order ID.</p>
        <input type="tel" id="trackPhno" placeholder="10-digit phone number" />
        <input type="number" id="trackOrderId" placeholder="Order ID" />
        <div id="trackOrderError" class="error-text hidden"></div>
        <button onclick="lookupOrder()">Track order</button>
        <button class="secondary" style="margin-top:10px;" onclick="toggleTrackOrder()">Back to login</button>
        <div id="trackOrderResult"></div>
    </section>

    <section id="shopSection" class="hidden">
        <div class="layout">
            <div>
                <div class="search-row">
                    <input type="text" id="searchName" placeholder="Search products" oninput="onSearchChange()" />
                    <select id="searchCategory" onchange="onSearchChange()">
                        <option value="">All categories</option>
                    </select>
                </div>
                <div class="grid-tabs">
                    <button class="active" id="tabAll" onclick="showTab('all')">All products</button>
                    <button id="tabWishlist" onclick="showTab('wishlist')">Wishlist (<span id="wishlistCount">0</span>)</button>
                    <button id="tabAccount" onclick="showTab('account')">My account</button>
                    <button id="tabNotifications" onclick="showTab('notifications')">My notifications</button>
                </div>
                <div id="productGrid" class="product-grid"></div>
                <div id="accountView" class="hidden"></div>
                <div id="notificationsView" class="hidden"></div>
            </div>

            <div class="panel">
                <h2>Your cart</h2>
                <div id="cartLines"><p style="color:var(--muted); font-size:14px;">Your cart is empty.</p></div>
                <div class="total-row"><span>Total</span><span id="cartTotal">₹0</span></div>

                <select id="shippingAddressId">
                    <option value="">No saved address selected</option>
                </select>
                <input type="text" id="couponCode" placeholder="Coupon code (optional)" />
                <input type="number" id="pointsRedeemed" min="0" placeholder="Loyalty points to redeem (optional)" />
                <p id="loyaltyHint" style="font-size:12px; color:var(--muted); margin:-6px 0 12px;"></p>

                <div id="payOptions">
                    <label class="pay-option selected" id="payPhonepeOption">
                        <input type="radio" name="payMethod" value="PHONEPE" checked onchange="onPaymentMethodChange()" />
                        Pay with PhonePe
                    </label>
                    <label class="pay-option" id="payCashOption">
                        <input type="radio" name="payMethod" value="CASH" onchange="onPaymentMethodChange()" />
                        Cash on delivery
                    </label>
                </div>

                <div id="phonepeFields">
                    <input type="tel" id="payerPhno" placeholder="PhonePe phone number" />
                    <input type="password" id="payerPin" placeholder="PhonePe PIN" />
                </div>

                <div id="checkoutError" class="error-text hidden"></div>
                <button onclick="placeOrder()">Place order</button>
                <div id="checkoutStatus"></div>
            </div>
        </div>
    </section>

    <div id="productModal" class="modal-overlay hidden">
        <div class="modal-box">
            <button class="modal-close" onclick="closeProductModal()">Close</button>
            <h2 id="modalProductName"></h2>
            <div id="modalRatingSummary" class="rating-row"></div>

            <h3>Frequently bought together</h3>
            <div id="modalFbt" class="fbt-strip"></div>

            <h3>Reviews</h3>
            <div id="modalReviews"></div>

            <h3>Write a review</h3>
            <div class="review-form">
                <input type="text" id="reviewerName" placeholder="Your name" />
                <input type="tel" id="reviewerPhno" placeholder="Your phone number" />
                <select id="reviewRating">
                    <option value="5">&#9733;&#9733;&#9733;&#9733;&#9733; - Excellent</option>
                    <option value="4">&#9733;&#9733;&#9733;&#9733;&#9734; - Good</option>
                    <option value="3">&#9733;&#9733;&#9733;&#9734;&#9734; - Okay</option>
                    <option value="2">&#9733;&#9733;&#9734;&#9734;&#9734; - Poor</option>
                    <option value="1">&#9733;&#9734;&#9734;&#9734;&#9734; - Terrible</option>
                </select>
                <input type="text" id="reviewComment" placeholder="Your comment" />
                <div id="reviewFormError" class="error-text hidden"></div>
                <button onclick="submitReview()">Submit review</button>
            </div>
        </div>
    </div>
</main>

<script>
    const BASE_URL = "http://localhost:8083";
    let customerPhno = null;
    let products = [];
    let cart = []; // {productId, name, price, quantity, stock}
    let wishlistProductIds = new Set();
    let priceDropsByProductId = new Map();
    let activeTab = "all";
    let allCategories = [];
    let searchDebounceTimer = null;
    let modalProductId = null;
    let ratingsByProductId = new Map();

    function showAccountInfo() {
      document.getElementById("accountInfo").innerHTML = customerPhno
        ? `Signed in as ${customerPhno} <button class="secondary" onclick="logout()">Log out</button>`
        : "";
    }

    function logout() {
      localStorage.removeItem("shopCustomerPhno");
      customerPhno = null;
      cart = [];
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("shopSection").classList.add("hidden");
      showAccountInfo();
    }

    function login() {
      const value = document.getElementById("loginPhno").value.trim();
      const errorBox = document.getElementById("loginError");
      if (!/^[6-9][0-9]{9}$/.test(value)) {
        errorBox.textContent = "Enter a valid 10-digit phone number.";
        errorBox.classList.remove("hidden");
        return;
      }
      errorBox.classList.add("hidden");
      customerPhno = value;
      localStorage.setItem("shopCustomerPhno", value);
      enterShop();
    }

    function toggleTrackOrder() {
      document.getElementById("loginSection").classList.toggle("hidden");
      document.getElementById("trackOrderSection").classList.toggle("hidden");
      document.getElementById("trackOrderError").classList.add("hidden");
      document.getElementById("trackOrderResult").innerHTML = "";
    }

    async function lookupOrder() {
      const phno = document.getElementById("trackPhno").value.trim();
      const orderId = document.getElementById("trackOrderId").value.trim();
      const errorBox = document.getElementById("trackOrderError");
      const resultBox = document.getElementById("trackOrderResult");
      resultBox.innerHTML = "";

      if (!/^[6-9][0-9]{9}$/.test(phno) || !orderId) {
        errorBox.textContent = "Enter a valid phone number and an order ID.";
        errorBox.classList.remove("hidden");
        return;
      }
      errorBox.classList.add("hidden");

      const ordersResponse = await fetch(`${BASE_URL}/cart/byphno?phno=${encodeURIComponent(phno)}`);
      const orders = ordersResponse.ok ? await ordersResponse.json() : [];
      const order = orders.find(o => String(o.orderId) === String(orderId));

      if (!order) {
        errorBox.textContent = "No order with that ID was found for this phone number.";
        errorBox.classList.remove("hidden");
        return;
      }

      const trackingResponse = await fetch(`${BASE_URL}/cart/${encodeURIComponent(orderId)}/tracking`);
      const timeline = trackingResponse.ok ? await trackingResponse.json() : [];

      resultBox.innerHTML = `
        <div class="cart-line"><span>Status</span><span>${escapeHtml(order.status)}</span></div>
        <div class="cart-line"><span>Total</span><span>₹${order.totalPrice.toFixed(2)}</span></div>
        <div class="cart-line"><span>Payment</span><span>${escapeHtml(order.paymentMethod)}${order.paymentMethod === "CASH" ? (order.paid ? " (paid)" : " (unpaid)") : ""}</span></div>
        ${timeline.map(event => `<div class="cart-line"><span>${escapeHtml(event.status)}</span><span>${new Date(event.timestamp).toLocaleString()}</span></div>`).join("")}
      `;
    }

    function enterShop() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("shopSection").classList.remove("hidden");
      document.getElementById("payerPhno").value = customerPhno;
      showAccountInfo();
      loadProducts();
      loadWishlist();
      loadLoyaltyBalance();
      loadAddressOptions();
    }

    async function loadAddressOptions() {
      const response = await fetch(`${BASE_URL}/addresses/byphno?phno=${encodeURIComponent(customerPhno)}`);
      const addresses = response.ok ? await response.json() : [];
      const select = document.getElementById("shippingAddressId");
      select.innerHTML = `<option value="">No saved address selected</option>` +
        addresses.map(a => `<option value="${a.id}">${escapeHtml(a.label || a.city)} - ${escapeHtml(a.line1)}${a.isDefault ? " (default)" : ""}</option>`).join("");
      const defaultAddress = addresses.find(a => a.isDefault);
      if (defaultAddress) select.value = defaultAddress.id;
    }

    async function loadLoyaltyBalance() {
      const response = await fetch(`${BASE_URL}/loyalty/byphno?phno=${encodeURIComponent(customerPhno)}`);
      const hint = document.getElementById("loyaltyHint");
      if (!response.ok) {
        hint.textContent = "";
        return;
      }
      const account = await response.json();
      hint.textContent = `You have ${account.pointsBalance} loyalty points (1 point = ₹1).`;
    }

    async function loadProducts() {
      const name = document.getElementById("searchName").value.trim();
      const category = document.getElementById("searchCategory").value;
      const query = new URLSearchParams();
      if (name) query.set("name", name);
      if (category) query.set("category", category);

      const response = await fetch(`${BASE_URL}/cart/search?${query.toString()}`);
      products = response.ok ? await response.json() : [];
      renderProducts();

      if (!name && !category) {
        refreshCategoryOptions();
      }
      loadRatings();
    }

    async function loadRatings() {
      if (!products.length) return;
      const idsQuery = products.map(p => `productIds=${p.productId}`).join("&");
      const response = await fetch(`${BASE_URL}/cart/ratings?${idsQuery}`);
      const ratings = response.ok ? await response.json() : [];
      ratingsByProductId = new Map(ratings.map(r => [r.productId, r]));
      renderProducts();
    }

    function starsFor(averageRating) {
      const rounded = Math.round(averageRating);
      return "&#9733;".repeat(rounded) + "&#9734;".repeat(5 - rounded);
    }

    function refreshCategoryOptions() {
      allCategories = [...new Set(products.map(p => p.productCategory).filter(Boolean))].sort();
      const select = document.getElementById("searchCategory");
      const current = select.value;
      select.innerHTML = `<option value="">All categories</option>` +
        allCategories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
      select.value = current;
    }

    function onSearchChange() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(loadProducts, 250);
    }

    async function loadWishlist() {
      const [wishlistResponse, priceDropsResponse] = await Promise.all([
        fetch(`${BASE_URL}/wishlist/byphno?phno=${encodeURIComponent(customerPhno)}`),
        fetch(`${BASE_URL}/wishlist/pricedrops?phno=${encodeURIComponent(customerPhno)}`)
      ]);
      const wishlist = wishlistResponse.ok ? await wishlistResponse.json() : [];
      const priceDrops = priceDropsResponse.ok ? await priceDropsResponse.json() : [];

      wishlistProductIds = new Set(wishlist.map(item => item.productId));
      priceDropsByProductId = new Map(priceDrops.map(drop => [drop.productId, drop]));
      document.getElementById("wishlistCount").textContent = wishlistProductIds.size;
      renderProducts();
    }

    function showTab(tab) {
      activeTab = tab;
      document.getElementById("tabAll").classList.toggle("active", tab === "all");
      document.getElementById("tabWishlist").classList.toggle("active", tab === "wishlist");
      document.getElementById("tabAccount").classList.toggle("active", tab === "account");
      document.getElementById("tabNotifications").classList.toggle("active", tab === "notifications");
      document.getElementById("productGrid").classList.toggle("hidden", tab === "account" || tab === "notifications");
      document.getElementById("accountView").classList.toggle("hidden", tab !== "account");
      document.getElementById("notificationsView").classList.toggle("hidden", tab !== "notifications");
      document.querySelector(".search-row").classList.toggle("hidden", tab === "account" || tab === "notifications");
      if (tab === "account") {
        loadAccountView();
      } else if (tab === "notifications") {
        loadNotificationsView();
      } else {
        renderProducts();
      }
    }

    async function loadNotificationsView() {
      const view = document.getElementById("notificationsView");
      view.innerHTML = `<p style="color:var(--muted);">Loading your notifications...</p>`;

      const response = await fetch(`${BASE_URL}/cart/notifications?phno=${encodeURIComponent(customerPhno)}`);
      const notifications = response.ok ? await response.json() : [];

      view.innerHTML = notifications.length ? notifications.map(n => `
        <div class="order-row">
          <div>
            <strong>Order #${n.orderId} - ${escapeHtml(n.eventType)}</strong>
            <span class="meta">${escapeHtml(n.message)}</span>
          </div>
          <div class="meta">${new Date(n.sentAt).toLocaleString()}</div>
        </div>
      `).join("") : `<p style="color:var(--muted);">No notifications yet.</p>`;
    }

    async function loadAccountView() {
      const view = document.getElementById("accountView");
      view.innerHTML = `<p style="color:var(--muted);">Loading your account...</p>`;

      const [profileResponse, ordersResponse, addressesResponse] = await Promise.all([
        fetch(`${BASE_URL}/customer/profile?phno=${encodeURIComponent(customerPhno)}`),
        fetch(`${BASE_URL}/cart/byphno?phno=${encodeURIComponent(customerPhno)}`),
        fetch(`${BASE_URL}/addresses/byphno?phno=${encodeURIComponent(customerPhno)}`)
      ]);
      const profile = profileResponse.ok ? await profileResponse.json() : null;
      const orders = ordersResponse.ok ? await ordersResponse.json() : [];
      orders.sort((a, b) => b.orderId - a.orderId);
      const addresses = addressesResponse.ok ? await addressesResponse.json() : [];

      const profileHtml = profile ? `
        <div class="account-summary">
          <div><span class="value">${profile.totalOrders}</span><span class="label">Orders</span></div>
          <div><span class="value">${profile.wishlistCount}</span><span class="label">Wishlisted</span></div>
          <div><span class="value">${profile.loyaltyPointsBalance}</span><span class="label">Points</span></div>
          <div><span class="value">${escapeHtml(profile.loyaltyTier)}</span><span class="label">Tier</span></div>
          <div><span class="value">${profile.reviewCount}</span><span class="label">Reviews written</span></div>
        </div>
      ` : "";

      const ordersHtml = orders.length ? orders.map(order => `
        <div class="order-row">
          <div>
            <strong>Order #${order.orderId}</strong>
            <span class="meta">${escapeHtml(order.status)} &middot; ${escapeHtml(order.paymentMethod)}${order.paymentMethod === "CASH" ? (order.paid ? " (paid)" : " (unpaid)") : ""}</span>
          </div>
          <div class="price">₹${order.totalPrice.toFixed(2)}</div>
          ${order.status === "PLACED" ? `<button class="secondary" style="width:auto;" onclick="cancelMyOrder(${order.orderId}, '${order.paymentMethod}')">Cancel</button>` : ""}
          ${order.status === "DELIVERED" ? `<button class="secondary" style="width:auto;" onclick="returnMyOrder(${order.orderId}, '${order.paymentMethod}')">Request return</button>` : ""}
        </div>
      `).join("") : `<p style="color:var(--muted);">No orders yet.</p>`;

      const addressesHtml = addresses.map(a => `
        <div class="order-row">
          <div>
            <strong>${escapeHtml(a.label || "Address")}</strong>${a.isDefault ? ' <span class="meta">(default)</span>' : ""}
            <span class="meta">${escapeHtml(a.line1)}, ${escapeHtml(a.city)}, ${escapeHtml(a.state)} ${escapeHtml(a.pincode)}</span>
          </div>
          <button class="secondary" style="width:auto;" onclick="removeAddress(${a.id})">Remove</button>
        </div>
      `).join("");

      view.innerHTML = `
        ${profileHtml}
        <h3 style="margin:16px 0 10px;">Order history</h3>
        ${ordersHtml}
        <h3 style="margin:20px 0 10px;">Saved addresses</h3>
        ${addressesHtml || `<p style="color:var(--muted);">No saved addresses yet.</p>`}
        <div style="margin-top:12px;">
          <input type="text" id="newAddrLabel" placeholder="Label, e.g. Home (optional)" />
          <input type="text" id="newAddrLine1" placeholder="Address line 1" />
          <input type="text" id="newAddrCity" placeholder="City" />
          <input type="text" id="newAddrState" placeholder="State" />
          <input type="text" id="newAddrPincode" placeholder="Pincode" />
          <label style="display:flex; align-items:center; gap:8px; margin:-4px 0 12px;">
            <input type="checkbox" id="newAddrDefault" style="width:auto;" /> Make default
          </label>
          <div id="addAddressError" class="error-text hidden"></div>
          <button onclick="addAddress()">Add address</button>
        </div>
      `;
    }

    async function cancelMyOrder(orderId, paymentMethod) {
      if (!confirm(`Cancel order #${orderId}? This can't be undone.`)) return;

      let query = "";
      if (paymentMethod !== "CASH") {
        const pin = prompt("Enter your PhonePe PIN to confirm the refund:");
        if (!pin) return;
        query = `?payerPhno=${encodeURIComponent(customerPhno)}&payerPin=${encodeURIComponent(pin)}`;
      }

      const response = await fetch(`${BASE_URL}/cart/${encodeURIComponent(orderId)}/cancel${query}`, { method: "POST" });
      if (!response.ok) {
        const body = await response.text();
        alert(body || "Could not cancel this order.");
        return;
      }
      loadAccountView();
    }

    async function returnMyOrder(orderId, paymentMethod) {
      const reason = prompt("Why are you returning this order?");
      if (!reason) return;

      let query = `?reason=${encodeURIComponent(reason)}`;
      if (paymentMethod !== "CASH") {
        const pin = prompt("Enter your PhonePe PIN to confirm the refund:");
        if (!pin) return;
        query += `&payerPhno=${encodeURIComponent(customerPhno)}&payerPin=${encodeURIComponent(pin)}`;
      }

      const response = await fetch(`${BASE_URL}/cart/${encodeURIComponent(orderId)}/return${query}`, { method: "POST" });
      if (!response.ok) {
        const body = await response.text();
        alert(body || "Could not return this order.");
        return;
      }
      loadAccountView();
    }

    async function addAddress() {
      const line1 = document.getElementById("newAddrLine1").value.trim();
      const city = document.getElementById("newAddrCity").value.trim();
      const state = document.getElementById("newAddrState").value.trim();
      const pincode = document.getElementById("newAddrPincode").value.trim();
      const errorBox = document.getElementById("addAddressError");

      if (!line1 || !city || !state || !pincode) {
        errorBox.textContent = "Address line 1, city, state and pincode are required.";
        errorBox.classList.remove("hidden");
        return;
      }

      const response = await fetch(`${BASE_URL}/addresses/self/add`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          customerPhno: Number(customerPhno),
          label: document.getElementById("newAddrLabel").value.trim() || null,
          line1, city, state, pincode,
          isDefault: document.getElementById("newAddrDefault").checked
        })
      });

      if (!response.ok) {
        errorBox.textContent = await response.text();
        errorBox.classList.remove("hidden");
        return;
      }

      loadAccountView();
      loadAddressOptions();
    }

    async function removeAddress(addressId) {
      await fetch(`${BASE_URL}/addresses/self/remove?phno=${encodeURIComponent(customerPhno)}&addressId=${encodeURIComponent(addressId)}`, {
        method: "DELETE"
      });
      loadAccountView();
      loadAddressOptions();
    }

    async function toggleWishlist(productId) {
      const isWishlisted = wishlistProductIds.has(productId);
      const query = `phno=${encodeURIComponent(customerPhno)}&productId=${encodeURIComponent(productId)}`;
      if (isWishlisted) {
        await fetch(`${BASE_URL}/wishlist/self/remove?${query}`, { method: "DELETE" });
      } else {
        await fetch(`${BASE_URL}/wishlist/self/add?${query}`, { method: "POST" });
      }
      await loadWishlist();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      const visibleProducts = activeTab === "wishlist"
        ? products.filter(p => wishlistProductIds.has(p.productId))
        : products;

      if (!visibleProducts.length) {
        grid.innerHTML = activeTab === "wishlist"
          ? `<p style="color:var(--muted);">Nothing wishlisted yet - tap the heart on a product to save it here.</p>`
          : `<p style="color:var(--muted);">No products available right now.</p>`;
        return;
      }

      grid.innerHTML = visibleProducts.map(p => {
        const isWishlisted = wishlistProductIds.has(p.productId);
        const priceDrop = priceDropsByProductId.get(p.productId);
        const rating = ratingsByProductId.get(p.productId);
        return `
        <div class="product-card">
          <button class="wishlist-btn ${isWishlisted ? "active" : ""}" onclick="toggleWishlist(${p.productId})"
                  aria-label="${isWishlisted ? "Remove from wishlist" : "Add to wishlist"}">${isWishlisted ? "&#9829;" : "&#9825;"}</button>
          <div class="product-image">
            ${p.productImageUrl
              ? `<img src="${escapeHtml(p.productImageUrl)}" alt="${escapeHtml(p.productName)}" onerror="this.parentElement.textContent='No image'" />`
              : "No image"}
          </div>
          <div class="product-body">
            <h3>${escapeHtml(p.productName)}</h3>
            <div class="meta">${escapeHtml(p.productCategory)} &middot; ${p.productStock > 0 ? p.productStock + " in stock" : "out of stock"}</div>
            ${rating && rating.reviewCount > 0
              ? `<div class="rating-row"><span class="stars">${starsFor(rating.averageRating)}</span> (${rating.reviewCount})</div>`
              : `<div class="rating-row">No reviews yet</div>`}
            <button class="details-link" onclick="openProductModal(${p.productId})">Reviews &amp; similar items</button>
            ${priceDrop ? `<div class="price-drop-badge">Price dropped ₹${priceDrop.priceDrop.toFixed(2)}</div>` : ""}
            <div class="price-row"><span class="price">₹${p.productPrice}</span></div>
            <div class="qty-row">
              <input type="number" min="1" value="1" id="qty_${p.productId}" ${p.productStock <= 0 ? "disabled" : ""} />
              <button style="width:auto;" ${p.productStock <= 0 ? "disabled" : ""} onclick="addToCart(${p.productId})">Add</button>
            </div>
          </div>
        </div>
      `;
      }).join("");
    }

    async function openProductModal(productId) {
      modalProductId = productId;
      const product = products.find(p => p.productId === productId);
      document.getElementById("modalProductName").textContent = product ? product.productName : "";
      document.getElementById("reviewFormError").classList.add("hidden");
      document.getElementById("reviewerName").value = "";
      document.getElementById("reviewComment").value = "";
      document.getElementById("productModal").classList.remove("hidden");

      const rating = ratingsByProductId.get(productId);
      document.getElementById("modalRatingSummary").innerHTML = rating && rating.reviewCount > 0
        ? `<span class="stars">${starsFor(rating.averageRating)}</span> ${rating.averageRating.toFixed(1)} (${rating.reviewCount} reviews)`
        : "No reviews yet";

      await Promise.all([loadModalReviews(productId), loadModalFrequentlyBoughtTogether(productId)]);
    }

    function closeProductModal() {
      document.getElementById("productModal").classList.add("hidden");
      modalProductId = null;
    }

    async function loadModalReviews(productId) {
      const box = document.getElementById("modalReviews");
      const response = await fetch(`${BASE_URL}/cart/reviews?productId=${productId}`);
      const reviews = response.ok ? await response.json() : [];
      box.innerHTML = reviews.length
        ? reviews.map(r => `
          <div class="review-item">
            <div class="review-meta">${escapeHtml(r.reviewerName)} &middot; <span class="stars">${starsFor(r.rating)}</span></div>
            <div class="review-comment">${escapeHtml(r.comment || "")}</div>
          </div>
        `).join("")
        : `<p style="color:var(--muted); font-size:14px;">No reviews yet - be the first!</p>`;
    }

    async function loadModalFrequentlyBoughtTogether(productId) {
      const box = document.getElementById("modalFbt");
      const response = await fetch(`${BASE_URL}/cart/frequentlyboughttogether?productId=${productId}`);
      const items = response.ok ? await response.json() : [];
      box.innerHTML = items.length
        ? items.map(item => `
          <div class="fbt-chip">
            ${escapeHtml(item.productName)}
            <div class="fbt-count">bought together ${item.timesBoughtTogether}&times;</div>
          </div>
        `).join("")
        : `<p style="color:var(--muted); font-size:14px;">No pairing data yet.</p>`;
    }

    async function submitReview() {
      const errorBox = document.getElementById("reviewFormError");
      errorBox.classList.add("hidden");

      const reviewerName = document.getElementById("reviewerName").value.trim();
      const reviewerPhno = document.getElementById("reviewerPhno").value.trim();
      const rating = Number(document.getElementById("reviewRating").value);
      const comment = document.getElementById("reviewComment").value.trim();

      if (!reviewerName || !reviewerPhno) {
        errorBox.textContent = "Please enter your name and phone number.";
        errorBox.classList.remove("hidden");
        return;
      }

      const response = await fetch(`${BASE_URL}/cart/reviews?productId=${modalProductId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reviewerName, reviewerPhno: Number(reviewerPhno), rating, comment })
      });

      if (!response.ok) {
        errorBox.textContent = "Could not submit your review. You may have already reviewed this product.";
        errorBox.classList.remove("hidden");
        return;
      }

      document.getElementById("reviewerName").value = "";
      document.getElementById("reviewerPhno").value = "";
      document.getElementById("reviewComment").value = "";
      await loadModalReviews(modalProductId);
      await loadRatings();
      const rating2 = ratingsByProductId.get(modalProductId);
      document.getElementById("modalRatingSummary").innerHTML = rating2 && rating2.reviewCount > 0
        ? `<span class="stars">${starsFor(rating2.averageRating)}</span> ${rating2.averageRating.toFixed(1)} (${rating2.reviewCount} reviews)`
        : "No reviews yet";
    }

    function addToCart(productId) {
      const product = products.find(p => p.productId === productId);
      if (!product) return;
      const qtyInput = document.getElementById(`qty_${productId}`);
      const quantity = Math.max(1, Number(qtyInput.value) || 1);

      const existing = cart.find(item => item.productId === productId);
      if (existing) {
        existing.quantity += quantity;
      } else {
        cart.push({ productId, name: product.productName, price: product.productPrice, quantity });
      }
      renderCart();
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.productId !== productId);
      renderCart();
    }

    // Adjusts an already-added line's quantity by +1/-1 rather than making the customer remove and re-add it.
    // Dropping to 0 removes the line entirely, same as the existing remove button. Clamped against the
    // product's known stock client-side as a convenience - the real limit is still enforced server-side at
    // checkout regardless.
    function changeCartQuantity(productId, delta) {
      const item = cart.find(i => i.productId === productId);
      if (!item) return;
      const product = products.find(p => p.productId === productId);
      const maxStock = product ? product.productStock : Infinity;
      item.quantity = Math.min(maxStock, item.quantity + delta);
      if (item.quantity <= 0) {
        cart = cart.filter(i => i.productId !== productId);
      }
      renderCart();
    }

    function renderCart() {
      const linesBox = document.getElementById("cartLines");
      if (!cart.length) {
        linesBox.innerHTML = `<p style="color:var(--muted); font-size:14px;">Your cart is empty.</p>`;
      } else {
        linesBox.innerHTML = cart.map(item => `
          <div class="cart-line">
            <span>${escapeHtml(item.name)}</span>
            <span class="qty-stepper">
              <button onclick="changeCartQuantity(${item.productId}, -1)">&minus;</button>
              <span>${item.quantity}</span>
              <button onclick="changeCartQuantity(${item.productId}, 1)">&plus;</button>
            </span>
            <span>₹${(item.price * item.quantity).toFixed(2)} <button onclick="removeFromCart(${item.productId})">&times;</button></span>
          </div>
        `).join("");
      }
      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      document.getElementById("cartTotal").textContent = `₹${total.toFixed(2)}`;
    }

    function onPaymentMethodChange() {
      const method = document.querySelector('input[name="payMethod"]:checked').value;
      document.getElementById("payPhonepeOption").classList.toggle("selected", method === "PHONEPE");
      document.getElementById("payCashOption").classList.toggle("selected", method === "CASH");
      document.getElementById("phonepeFields").classList.toggle("hidden", method === "CASH");
    }

    function setCheckoutError(message) {
      const box = document.getElementById("checkoutError");
      if (!message) {
        box.classList.add("hidden");
        box.textContent = "";
        return;
      }
      box.textContent = message;
      box.classList.remove("hidden");
    }

    function setCheckoutStatus(message, kind) {
      const box = document.getElementById("checkoutStatus");
      box.className = "status-banner " + (kind || "");
      box.textContent = message || "";
    }

    async function placeOrder() {
      setCheckoutError(null);
      setCheckoutStatus("");

      if (!cart.length) {
        setCheckoutError("Your cart is empty.");
        return;
      }

      const method = document.querySelector('input[name="payMethod"]:checked').value;
      let payerPhno = null;
      let payerPin = null;

      if (method === "PHONEPE") {
        payerPhno = document.getElementById("payerPhno").value.trim();
        payerPin = document.getElementById("payerPin").value.trim();
        if (!/^[6-9][0-9]{9}$/.test(payerPhno) || !payerPin) {
          setCheckoutError("Enter the PhonePe phone number and PIN, or switch to cash on delivery.");
          return;
        }
      }

      const couponCode = document.getElementById("couponCode").value.trim();
      const pointsRedeemed = document.getElementById("pointsRedeemed").value.trim();
      const shippingAddressId = document.getElementById("shippingAddressId").value;

      const cartPayload = {
        customerPhno: Number(customerPhno),
        orderItems: cart.map(item => ({ productId: item.productId, productQuantity: item.quantity })),
        paymentMethod: method,
        couponCode: couponCode || null,
        pointsRedeemed: pointsRedeemed ? Number(pointsRedeemed) : null,
        shippingAddressId: shippingAddressId ? Number(shippingAddressId) : null
      };

      const query = method === "PHONEPE"
        ? `?payerPhno=${encodeURIComponent(payerPhno)}&payerPin=${encodeURIComponent(payerPin)}`
        : "";

      setCheckoutStatus("Placing your order...", "info");
      try {
        const response = await fetch(`${BASE_URL}/cart/checkout${query}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Idempotency-Key": crypto.randomUUID()
          },
          body: JSON.stringify(cartPayload)
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || `Request failed (${response.status})`);
        }

        const order = await response.json();
        cart = [];
        renderCart();
        document.getElementById("payerPin").value = "";
        document.getElementById("couponCode").value = "";
        document.getElementById("pointsRedeemed").value = "";
        setCheckoutStatus(
          `Order #${order.orderId} placed${method === "CASH" ? " - pay on delivery." : ", paid via PhonePe."}`,
          "success"
        );
        loadProducts();
        loadLoyaltyBalance();
      } catch (error) {
        setCheckoutStatus("");
        setCheckoutError(error.message);
      }
    }

    const savedPhno = localStorage.getItem("shopCustomerPhno");
    if (savedPhno) {
      customerPhno = savedPhno;
      enterShop();
    }
</script>
</body>
</html>
