<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared wishlist - Charan Mart</title>
    <style>
        :root { --primary:#7c3aed; --dark:#0f172a; --muted:#64748b; --border:#e2e8f0; --bg:#f8fafc; --surface:#ffffff; --green:#16a34a; --red:#dc2626; color-scheme: light dark; }
        @media (prefers-color-scheme: dark) {
          :root { --dark:#e2e8f0; --muted:#94a3b8; --border:#334155; --bg:#0f172a; --surface:#1e293b; }
        }
        * { box-sizing:border-box; margin:0; padding:0; font-family: Inter, Segoe UI, Arial, sans-serif; }
        body { background:var(--bg); color:var(--dark); min-height:100vh; }
        header { background:linear-gradient(120deg,#4c1d95,#7c3aed 55%,#f97316); color:#fff; padding:20px 16px; }
        main { max-width:960px; margin:0 auto; padding:20px 16px; }
        h1 { font-size:20px; }
        .sub { color:var(--muted); font-size:14px; margin:6px 0 18px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
        .card img, .card .noimg { width:100%; height:150px; object-fit:cover; background:var(--border); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
        .card .body { padding:12px; }
        .name { font-weight:600; font-size:15px; }
        .cat { color:var(--muted); font-size:12px; margin:2px 0 8px; }
        .price { font-weight:700; }
        .stock { font-size:12px; margin-top:4px; }
        .in { color:var(--green); } .out { color:var(--red); }
        a.btn { display:inline-block; margin-top:18px; background:var(--primary); color:#fff; padding:10px 16px; border-radius:8px; text-decoration:none; font-size:14px; }
    </style>
</head>
<body>
<header><h1>Charan Mart</h1></header>
<main>
    <h2>A shared wishlist</h2>
    <p class="sub" id="status">Loading...</p>
    <div class="grid" id="grid"></div>
    <button class="btn" id="addAll" style="border:0; cursor:pointer;" hidden onclick="addAllToCart()">Add all to my cart</button>
    <a class="btn" href="/shop.html">Browse the store</a>
</main>
<script>
    function escapeHtml(v) {
      return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    // Only http(s) image URLs are rendered - the value comes from the catalog, but never trust it as markup.
    function safeImage(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
    let inStockIds = [];

    // Hands the in-stock products to the storefront: it adds them to the visitor cart once they are signed in.
    function addAllToCart() {
      try { localStorage.setItem("pendingCartAdds", JSON.stringify(inStockIds)); } catch (e) {
        document.getElementById("status").textContent = "Your browser blocked saving the list - open the store and add items there.";
        return;
      }
      location.href = "/shop.html";
    }

    async function load() {
      const status = document.getElementById("status");
      const token = new URLSearchParams(location.search).get("t") || "";
      try {
        const r = await fetch("/wishlist/shared/" + encodeURIComponent(token));
        if (!r.ok) { status.textContent = "This wishlist link is not valid any more."; return; }
        const items = await r.json();
        inStockIds = items.filter(p => p.inStock).map(p => p.productId);
        document.getElementById("addAll").hidden = inStockIds.length === 0;
        status.textContent = items.length ? items.length + " item(s) someone wants to share with you." : "This wishlist is empty right now.";
        document.getElementById("grid").innerHTML = items.map(p => {
          const img = safeImage(p.productImageUrl);
          return `<div class="card">${img ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(p.productName)}" />` : `<div class="noimg">No image</div>`}
            <div class="body"><div class="name">${escapeHtml(p.productName)}</div>
            <div class="cat">${escapeHtml(p.productCategory)}</div>
            <div class="price">&#8377;${Number(p.productPrice).toFixed(2)}</div>
            <div class="stock ${p.inStock ? "in" : "out"}">${p.inStock ? "In stock" : "Out of stock"}</div></div></div>`;
        }).join("");
      } catch (e) { status.textContent = "Could not load this wishlist. Please try again."; }
    }
    load();
</script>
</body>
</html>
