spring.application.name=OrderService

server.port=8083

# Optional local file (git-ignored) holding INTERNAL_SERVICE_API_KEY and DB_PASSWORD; see .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/charan
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# The PhonepayService instance this service charges buyers through (override with PHONEPE_SERVICE_URL).
phonepe.service.url=${PHONEPE_SERVICE_URL:http://localhost:8081}
# Never wait forever on a payment: fail the order instead of hanging.
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Guards this service's own mutating endpoints (see SecurityConfig), and is what this service sends as
# X-Service-Key when it calls ProductService's protected endpoints. Must be the EXACT same value as
# internal.service.api-key on ProductService.
internal.service.api-key=${INTERNAL_SERVICE_API_KEY}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Storefront sign-in codes are emailed via Gmail SMTP, same setup as Bankapplication's forgot-PIN email.
# MAIL_USERNAME/MAIL_PASSWORD go in .env; MAIL_PASSWORD must be a Gmail App Password, not the account password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# JavaMail waits forever by default; never let an unreachable mail server hang a sign-in or a ship/deliver call.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
order.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Storefront sign-in (see CustomerAuthService).
customer.login.code-ttl-minutes=10
customer.login.resend-cooldown-seconds=60
customer.login.session-ttl-days=30
# LOCAL DEVELOPMENT ONLY: when an email can't be sent, write the sign-in code to the log instead so you can still
# sign in without mail credentials. Never enable this where real customers sign in.
customer.login.log-codes-when-mail-fails=${CUSTOMER_LOGIN_LOG_CODES:false}
