spring.application.name=OrderService

server.port=8083

# Optional local file (git-ignored) holding INTERNAL_SERVICE_API_KEY and DB_PASSWORD; see .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/charan
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# The PhonepayService instance this service charges buyers through (override with PHONEPE_SERVICE_URL).
phonepe.service.url=${PHONEPE_SERVICE_URL:http://localhost:8081}
# Never wait forever on a payment: fail the order instead of hanging.
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Guards this service's own mutating endpoints (see SecurityConfig), and is what this service sends as
# X-Service-Key when it calls ProductService's protected endpoints. Must be the EXACT same value as
# internal.service.api-key on ProductService.
internal.service.api-key=${INTERNAL_SERVICE_API_KEY}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Storefront sign-in codes are emailed via Gmail SMTP, same setup as Bankapplication's forgot-PIN email.
# MAIL_USERNAME/MAIL_PASSWORD go in .env; MAIL_PASSWORD must be a Gmail App Password, not the account password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# JavaMail waits forever by default; never let an unreachable mail server hang a sign-in or a ship/deliver call.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
order.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Storefront sign-in (see CustomerAuthService).
customer.login.code-ttl-minutes=10
customer.login.resend-cooldown-seconds=60
customer.login.session-ttl-days=30
# Sliding-window limits on the public sign-in endpoints (see LoginRateLimiter): code requests per client address /
# phone / target email per window, and verify attempts per client address / phone per window.
customer.login.rate-limit.enabled=true
customer.login.rate-limit.requests-per-ip=20
customer.login.rate-limit.requests-per-phone=5
customer.login.rate-limit.requests-per-email=5
customer.login.rate-limit.request-window-minutes=60
customer.login.rate-limit.verifies-per-ip=40
customer.login.rate-limit.verifies-per-phone=15
customer.login.rate-limit.verify-window-minutes=15
# LOCAL DEVELOPMENT ONLY: when an email can't be sent, write the sign-in code to the log instead so you can still
# sign in without mail credentials. Never enable this where real customers sign in.
customer.login.log-codes-when-mail-fails=${CUSTOMER_LOGIN_LOG_CODES:false}

# Restock / price-drop emails (see StockAlertService): the job runs every alerts.interval-ms (default 10 min), first run
# after alerts.initial-delay-ms. alerts.shop-url, when set, is added to the email as a "Shop now" link.
alerts.enabled=${ALERTS_ENABLED:true}
alerts.interval-ms=${ALERTS_INTERVAL_MS:600000}
alerts.initial-delay-ms=60000
alerts.shop-url=${SHOP_URL:}

# Pending-payment sweep (see PendingPaymentSweeper): resolves unpaid UPI orders every sweeper.interval-ms (default 1 min).
sweeper.enabled=${SWEEPER_ENABLED:true}
sweeper.interval-ms=${SWEEPER_INTERVAL_MS:60000}
sweeper.initial-delay-ms=30000

# Daily admin digest (see DigestScheduler): emailed to ADMIN_EMAIL at digest.cron in digest.zone. Nothing is sent
# while ADMIN_EMAIL is empty.
digest.enabled=${DIGEST_ENABLED:true}
digest.to=${ADMIN_EMAIL:}
digest.cron=${DIGEST_CRON:0 0 8 * * *}
digest.zone=${DIGEST_ZONE:Asia/Kolkata}

# Loyalty points expiry warning (see LoyaltyExpiryWarningService): once a day, customers whose points expire within
# loyalty.warning.days days get one email (they need a verified email on file).
loyalty.warning.enabled=${LOYALTY_WARNING_ENABLED:true}
loyalty.warning.days=${LOYALTY_WARNING_DAYS:14}
loyalty.warning.cron=${LOYALTY_WARNING_CRON:0 30 9 * * *}
loyalty.warning.zone=${DIGEST_ZONE:Asia/Kolkata}
# Abandoned-cart reminder emails. OFF by default because it emails customers - set ABANDONED_CART_ENABLED=true once
# mail credentials are configured. A cart untouched for after-hours (but younger than max-age-days) gets one email.
abandoned-cart.enabled=${ABANDONED_CART_ENABLED:false}
abandoned-cart.after-hours=${ABANDONED_CART_AFTER_HOURS:24}
abandoned-cart.max-age-days=${ABANDONED_CART_MAX_AGE_DAYS:7}
abandoned-cart.cron=${ABANDONED_CART_CRON:0 15 * * * *}

# Refer-a-friend (see ReferralService): both sides get referral.bonus-points once the friend's first order worth at
# least referral.min-order-amount (net of refunds) is delivered; one referrer can be rewarded this many times.
referral.bonus-points=100
referral.min-order-amount=200
referral.max-rewards-per-referrer=10

# Promotional emails end with a one-click unsubscribe link (see EmailPreferenceService). It must point at where this service
# is reachable from a customer's inbox; with no value the footer just says to use "My account" instead.
email.public-base-url=${PUBLIC_BASE_URL:${SHOP_URL:}}

# Cash-on-delivery risk limits (see CodRiskService): a number with cod.max-failed-orders or more cash orders that
# ended cancelled/returned in the last cod.lookback-days must pay online, and until a number's first order is
# delivered cash is accepted only up to cod.new-customer-max-amount (0 = no cap). Admin overrides always apply.
cod.enabled=${COD_RISK_ENABLED:true}
cod.max-failed-orders=${COD_MAX_FAILED_ORDERS:3}
cod.lookback-days=${COD_LOOKBACK_DAYS:180}
cod.new-customer-max-amount=${COD_NEW_CUSTOMER_MAX_AMOUNT:2000}

# Store credit (see StoreCreditService): when on, cash already collected on a cancelled/returned order is paid back
# as store credit; off = it is only recorded as no longer due.
store-credit.cash-refunds=${STORE_CREDIT_CASH_REFUNDS:true}

# Gift cards (see GiftCardService): the largest card an owner can mint, and how long a new card lasts unless the
# mint request says otherwise (0 days = never expires).
gift-card.max-amount=${GIFT_CARD_MAX_AMOUNT:10000}
gift-card.default-expiry-days=${GIFT_CARD_EXPIRY_DAYS:365}

# Named admin accounts (see AdminAuthService / AdminPolicy): how long a dashboard sign-in lasts, and how many password
# attempts one address / one username gets per window before a 429. The shared service key is unaffected by all this.
admin.session-ttl-hours=${ADMIN_SESSION_TTL_HOURS:12}
# true = the browser dashboard no longer accepts the shared X-Service-Key: everyone signs in as themselves (see
# NamedLoginPolicy). Ignored until an active OWNER account exists. Scripts and other services keep using the key.
admin.require-named-login=${ADMIN_REQUIRE_NAMED_LOGIN:false}
admin.login.rate-limit.per-ip=${ADMIN_LOGIN_LIMIT_PER_IP:30}
admin.login.rate-limit.per-username=${ADMIN_LOGIN_LIMIT_PER_USERNAME:10}
admin.login.rate-limit.window-minutes=${ADMIN_LOGIN_LIMIT_WINDOW_MINUTES:15}

# GST on invoices (see GstCalculator / InvoiceNumberService). Catalog prices include GST; products without their own
# rate use gst.default-rate. Set STORE_GSTIN / STORE_STATE for a proper tax invoice: with the store's state known,
# an order shipped to another state shows IGST instead of CGST+SGST.
gst.default-rate=${GST_DEFAULT_RATE:18}
gst.store-name=${STORE_NAME:Charan Mart}
gst.store-gstin=${STORE_GSTIN:}
gst.store-state=${STORE_STATE:}
gst.invoice-prefix=${INVOICE_PREFIX:CM}
