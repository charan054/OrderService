spring.application.name=OrderService

server.port=8083

# Optional local file (git-ignored) holding INTERNAL_SERVICE_API_KEY; see .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/charan
spring.datasource.username=root
spring.datasource.password=***REMOVED***

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Guards this service's own mutating endpoints (see SecurityConfig), and is what this service sends as
# X-Service-Key when it calls ProductService's protected endpoints. Must be the EXACT same value as
# internal.service.api-key on ProductService.
internal.service.api-key=${INTERNAL_SERVICE_API_KEY}